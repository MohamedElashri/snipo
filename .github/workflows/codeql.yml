name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '20 14 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'go', 'actions']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1

    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # sanad: ref=v4
      with:
        languages: ${{ matrix.language }}
        #queries: security-extended,security-and-quality
        queries: security-extended
        config-file: .codeql/config.yml
    - name: Autobuild
      uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # sanad: ref=v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # sanad: ref=v4
      with:
        category: "/language:${{matrix.language}}"
