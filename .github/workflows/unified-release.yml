name: Unified Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch, or tag to preview (publishes nothing)'
        required: true
        default: main

concurrency:
  group: unified-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.19.0

jobs:
  resolve:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        env:
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          bash scripts/bump-version.sh --check "$VERSION"
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    uses: ./.github/workflows/release-checks.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build-snipo:
    name: Package server
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p dist
          go build -trimpath -mod=readonly -ldflags="-w -s -X main.Version=$VERSION -X main.Commit=$COMMIT" -o dist/snipo ./cmd/server
          tar -czf "dist/snipo_${VERSION}_linux_${GOARCH}.tar.gz" -C dist snipo -C .. README.md LICENSE docs/openapi.yaml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-server-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-snippy:
    name: Package Snippy
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --skip=publish --clean
          workdir: tui
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-snippy
          path: |
            tui/dist/*.tar.gz
            tui/dist/*.zip
            tui/dist/*.deb
            tui/dist/*.rpm
          if-no-files-found: error
      - name: Check packaged version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: tui/dist/snippy_linux_amd64_v1/snippy version | grep -F "Snippy $VERSION "

  build-extensions:
    name: Package extensions
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build packages
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          npm ci
          npm run build -w @snipo/api-client
          bash extension/build.sh all
          cd vscode-extension
          npx --no-install vsce package --no-dependencies -o "snipo-$VERSION.vsix"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-extensions
          path: |
            extension/dist/*.zip
            vscode-extension/*.vsix
          if-no-files-found: error

  build-images:
    name: Scan ${{ matrix.variant }} ${{ matrix.arch }} image
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, hardened]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: matrix.variant == 'hardened'
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_API_KEY }}
      - id: image
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "tag=snipo:release-$VARIANT-$ARCH" >> "$GITHUB_OUTPUT"
          if [ "$VARIANT" = hardened ]; then
            echo 'dockerfile=Dockerfile.hardened' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerfile=Dockerfile' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.image.outputs.tag }}
          outputs: type=docker,dest=image.tar
          provenance: false
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            COMMIT=${{ needs.resolve.outputs.sha }}
      - name: Verify version and health
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker load -i image.tar
          docker run --rm --platform "linux/$ARCH" "$IMAGE" version | grep -F "snipo $VERSION "
          docker run -d --name smoke --platform "linux/$ARCH" --network none -e SNIPO_MASTER_PASSWORD=release-smoke -e SNIPO_SESSION_SECRET=release-smoke-session-secret-32chars "$IMAGE"
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec smoke /snipo health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install scanner
        run: bash scripts/install-trivy.sh
      - name: Scan final image
        run: trivy image --input image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output image-scan.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: image-scan-${{ matrix.variant }}-${{ matrix.arch }}
          path: image-scan.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-image-${{ matrix.variant }}-${{ matrix.arch }}
          path: image.tar
          compression-level: 0
          if-no-files-found: error

  assemble:
    name: Validate release assets
    needs: [resolve, build-snipo, build-snippy, build-extensions, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist/release
      - name: Record asset hashes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
        run: node scripts/release-manifest.mjs dist/release "$VERSION" "$COMMIT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error

  publish-images:
    name: Publish scanned images
    if: github.event_name == 'push'
    needs: [resolve, assemble]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-image-*
          path: images
      - name: Push tested content and version indexes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          for variant in standard hardened; do
            suffix=''
            if [ "$variant" = hardened ]; then suffix=-hardened; fi
            for arch in amd64 arm64; do
              docker load -i "images/release-image-$variant-$arch/image.tar"
              ref="$IMAGE:$VERSION$suffix-$arch"
              local_id=$(docker image inspect "snipo:release-$variant-$arch" --format '{{.Id}}')
              if docker manifest inspect "$ref" > existing.json 2>/dev/null; then
                test "$(jq -r '.config.digest' existing.json)" = "$local_id"
              else
                docker tag "snipo:release-$variant-$arch" "$ref"
                docker push "$ref"
              fi
            done
            # Creating an index from already-pushed, identical image manifests is retryable.
            docker buildx imagetools create -t "$IMAGE:$VERSION$suffix" "$IMAGE:$VERSION$suffix-amd64" "$IMAGE:$VERSION$suffix-arm64"
          done
          jq -n --arg image "$IMAGE" --arg version "$VERSION" \
            --arg standard "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" \
            --arg hardened "$(docker buildx imagetools inspect "$IMAGE:$VERSION-hardened" --format '{{.Manifest.Digest}}')" \
            '{image:$image,version:$version,standard:$standard,hardened:$hardened}' > image-digests.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: published-image-digests
          path: image-digests.json

  publish-release:
    name: Publish complete GitHub release
    needs: [resolve, assemble, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: dist/release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: published-image-digests
          path: dist/release
      - name: Finalize release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs dist/release "$VERSION" "$COMMIT"
          (cd dist/release && sha256sum --check checksums.txt)
          sed -n "/^## \\[$VERSION\\]/,/^## \\[/p" docs/CHANGELOG.md | sed '$d' > release-notes.md
          cat >> release-notes.md <<'NOTES'

          All components are packaged from the tagged commit. Download the VSIX and
          Chrome/Firefox ZIPs below. Extension store submissions are pending.
          Firefox ZIPs are for temporary loading or store submission, not signed installation.
          NOTES
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true ]; then
              gh release upload "v$VERSION" dist/release/* --clobber
              gh release edit "v$VERSION" --notes-file release-notes.md --draft=false --latest
            else
              mkdir existing
              gh release download "v$VERSION" -p checksums.txt -D existing
              cmp existing/checksums.txt dist/release/checksums.txt
            fi
          else
            gh release create "v$VERSION" --verify-tag --draft --title "Snipo $VERSION" --notes-file release-notes.md
            gh release upload "v$VERSION" dist/release/*
            gh release edit "v$VERSION" --draft=false --latest
          fi

  promote-images:
    name: Advance stable image tags
    needs: [resolve, publish-release]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: published-image-digests
      - name: Promote verified digests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$VERSION"
          IMAGE=$(jq -r .image image-digests.json)
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$(jq -r .standard image-digests.json)"
          docker buildx imagetools create -t "$IMAGE:latest-hardened" "$IMAGE@$(jq -r .hardened image-digests.json)"

  homebrew:
    name: Update Homebrew
    needs: [resolve, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Download published manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$VERSION"
          gh release download "v$VERSION" -p release-manifest.json -D published
          node scripts/homebrew-formula.mjs published/release-manifest.json > snippy.rb
      - uses: actions/checkout@v7.0.1
        with:
          repository: MohamedElashri/homebrew-snippy
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Update formula
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir -p tap/Formula
          cp snippy.rb tap/Formula/snippy.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/snippy.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update snippy to $VERSION"
            git push
          fi

  summary:
    name: Release status
    if: always()
    needs: [resolve, checks, assemble, publish-images, publish-release, promote-images, homebrew]
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHECKS: ${{ needs.checks.result }}
          ASSETS: ${{ needs.assemble.result }}
          IMAGES: ${{ needs.publish-images.result }}
          RELEASE: ${{ needs.publish-release.result }}
          ALIASES: ${{ needs.promote-images.result }}
          HOMEBREW: ${{ needs.homebrew.result }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Snipo $VERSION
          | Destination | Result |
          |---|---|
          | Tests and dependency scans | $CHECKS |
          | Packages and image scans | $ASSETS |
          | Versioned Docker images | $IMAGES |
          | GitHub release | $RELEASE |
          | Stable Docker tags | $ALIASES |
          | Homebrew | $HOMEBREW |
          | VS Code / Chrome / Firefox stores | Pending manual submission |

          Manual runs are previews: publishing jobs are skipped.
          EOF
