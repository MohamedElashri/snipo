name: Snipo Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v1.2.3)'
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # sanad: ref=v7.0.0
        with:
          ref: ${{ inputs.tag_name }}

      - name: Verify Version Match
        run: |
          # Extract version from internal/version/version.go
          CODE_VERSION=$(grep 'const Current =' internal/version/version.go | cut -d '"' -f 2)
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ inputs.tag_name }}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          
          # Remove 'v' prefix if present from tag for comparison
          CLEAN_TAG_VERSION=${TAG_VERSION#v}
          
          echo "Code version: $CODE_VERSION"
          echo "Tag version: $TAG_VERSION (Clean: $CLEAN_TAG_VERSION)"
          
          if [ "$CODE_VERSION" != "$CLEAN_TAG_VERSION" ]; then
            echo "::error::Version mismatch! internal/version/version.go ($CODE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # sanad: ref=v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # sanad: ref=v7.0.0
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # sanad: ref=v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          COMMIT=$(git rev-parse --short HEAD)
          go build \
            -ldflags="-w -s -X main.Version=${VERSION} -X main.Commit=${COMMIT}" \
            -o snipo \
            ./cmd/server

      - name: Package
        run: |
          tar czf snipo_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz snipo README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # sanad: ref=v7.0.1
        with:
          name: snipo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: snipo_${{ matrix.goos }}_${{ matrix.goarch }}.*

  build-docker:
    name: Build Docker Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            dockerfile: Dockerfile
            suffix: ""
          - name: hardened
            dockerfile: Dockerfile.hardened
            suffix: "-hardened"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # sanad: ref=v7.0.0

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Lowercase Repo Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # sanad: ref=v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # sanad: ref=v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # sanad: ref=v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DHI Registry
        if: matrix.name == 'hardened'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # sanad: ref=v4.5.1
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_API_KEY }}

      - name: Debug DHI Pull
        if: matrix.name == 'hardened'
        run: |
          docker pull dhi.io/golang:1-alpine3.23
          docker pull dhi.io/golang:1-alpine3.23-dev

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # sanad: ref=v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ matrix.name == 'standard' }}
            type=raw,value=latest-hardened,suffix=,enable=${{ matrix.name == 'hardened' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # sanad: ref=v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ matrix.suffix }}
          cache-to: type=inline

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # sanad: ref=v7.0.0
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # sanad: ref=v8.0.1
        with:
          path: artifacts
          pattern: snipo_*
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
          fi
          
          echo "" >> CHANGELOG.md
          echo "## Docker" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Standard" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag_name || github.ref_name }}" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Hardened" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag_name || github.ref_name }}-hardened" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # sanad: ref=v3.0.2
        with:
          body_path: CHANGELOG.md
          files: artifacts/*
          generate_release_notes: true
