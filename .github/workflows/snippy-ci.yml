name: snippy CI

on:
  push:
    branches: [main]
    paths:
      - 'tui/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main, dev]
    paths:
      - 'tui/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tui
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'tui/go.mod'
          cache: true
          cache-dependency-path: tui/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tui
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'tui/go.mod'
          cache: true
          cache-dependency-path: tui/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          working-directory: tui
          args: --timeout=5m

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: '' # Allow go-version-file to select the toolchain.
          go-version-file: 'tui/go.mod'
          check-latest: true
          work-dir: tui
          go-package: ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, govulncheck]
    defaults:
      run:
        working-directory: ./tui
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'tui/go.mod'
          cache: true
          cache-dependency-path: tui/go.sum

      - name: Build binary
        run: |
          go build -ldflags="-w -s" -o snippy ./cmd/snippy

      - name: Verify binary
        run: ./snippy version
