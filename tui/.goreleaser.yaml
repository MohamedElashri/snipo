version: 2
project_name: snippy

# Preview and tagged releases package the same version without GoReleaser publishing.
snapshot:
  version_template: '{{ .Env.RELEASE_VERSION }}'

builds:
  - main: ./cmd/snippy
    binary: snippy
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

nfpms:
  - file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}'
    vendor: Mohamed Elashri
    homepage: https://github.com/MohamedElashri/snipo
    maintainer: Mohamed Elashri <snippy@elashri.com>
    description: Terminal client for the Snipo snippet manager.
    license: AGPL-3.0
    formats: [deb, rpm]
    bindir: /usr/bin

checksum:
  name_template: snippy_checksums.txt
