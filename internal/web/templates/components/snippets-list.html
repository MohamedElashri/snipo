{{define "snippets-list"}}
<!-- Content area -->
<section class="snippet-list" aria-label="Snippet library" :aria-busy="loading">
    <div class="library-heading"><div><h1 x-text="libraryTitle()">All snippets</h1><span class="library-count" x-text="pagination.total + (pagination.total === 1 ? ' snippet' : ' snippets')"></span></div>
        <label class="library-layout-picker">View
            <select aria-label="Snippet layout" :value="viewMode === 'grid' ? 'grid' : density === 'compact' ? 'compact' : 'list'" @change="setLibraryLayout($event.target.value)">
                <option value="grid">Cards</option>
                <option value="list">List</option>
                <option value="compact">Compact</option>
            </select>
        </label>
    </div>
    <nav class="library-pagination" aria-label="Library pages" x-show="pagination.totalPages > 1">
        <span x-text="((pagination.page - 1) * pagination.limit + 1) + '–' + Math.min(pagination.page * pagination.limit, pagination.total) + ' of ' + pagination.total"></span>
        <div class="library-page-controls">
            <button @click="goToPage(pagination.page - 1)" :disabled="loading || pagination.page <= 1" aria-label="Previous page">‹</button>
            <select aria-label="Page" :value="pagination.page" @change="goToPage(Number($event.target.value))" :disabled="loading">
                <template x-for="page in pagination.totalPages" :key="page"><option :value="page" x-text="'Page ' + page"></option></template>
            </select>
            <button @click="goToPage(pagination.page + 1)" :disabled="loading || pagination.page >= pagination.totalPages" aria-label="Next page">›</button>
        </div>
    </nav>
    <details class="library-filters"><summary>Filter by language</summary>
        <label>Language<select x-model="filter.language" @change="search()">
            <option value="">All languages</option>
            <template x-for="language in ['bash', 'go', 'javascript', 'json', 'markdown', 'plaintext', 'python', 'sql', 'typescript', 'yaml']" :key="language"><option :value="language" x-text="language"></option></template>
        </select></label>
    </details>
    <div class="filter-chips" x-show="hasActiveFilters()">
        <template x-for="chip in activeFilterChips()" :key="chip.key"><button class="filter-chip" @click="removeFilter(chip.key)" :aria-label="'Remove filter: ' + chip.label"><span x-text="chip.label"></span><span aria-hidden="true"> ×</span></button></template>
        <button class="filter-clear" @click="clearFilters()">Clear all</button>
    </div>
    <!-- Loading state -->
    <div class="loading" x-show="loading">
        <div class="spinner"></div>
    </div>

    <div class="empty-state" x-show="loadError && !loading" role="alert"><h3>Could not load your library</h3><p x-text="loadError"></p><button class="btn-secondary" @click="loadSnippets()">Try again</button></div>
    <!-- Empty state -->
    <div class="empty-state" x-show="!loading && !loadError && snippets.length === 0">
        <template x-if="filter.isDeleted">
            <div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48"
                    style="opacity: 0.5; margin: 0 auto 1rem;">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                <h3>Trash is empty</h3>
                <p>No deleted snippets found</p>
            </div>
        </template>
        <template x-if="!filter.isDeleted">
            <div>
                <img src="{{.BasePath}}/static/logo.png" alt="Snipo" width="48" height="48" style="opacity: 0.5;">
                <h3 x-text="hasActiveFilters() ? 'No matching snippets' : 'Your library starts here'"></h3>
                <p x-text="hasActiveFilters() ? 'Try a different search or remove a filter.' : 'Keep a useful command, a configuration, or a piece of code.'"></p>
                <button class="btn-secondary" x-show="hasActiveFilters()" @click="clearFilters()">Clear filters</button>
                <button class="btn-primary mt-4" x-show="!hasActiveFilters()" @click="newSnippet()">
                    Create Snippet
                </button>
            </div>
        </template>
    </div>

    <!-- Snippet grid/list -->
    <div :class="showEditor || viewMode === 'list' ? 'snippet-list-view' : 'snippet-grid'" x-show="!loading && snippets.length > 0">
        <template x-for="snippet in snippets" :key="snippet.id">
            <article class="snippet-card" :class="{ selected: showEditor && editingSnippet?.id === snippet.id }">
                <div class="snippet-open" role="button" tabindex="0" :aria-label="'Open ' + snippet.title" :aria-current="showEditor && editingSnippet?.id === snippet.id ? 'true' : null" @click="viewSnippet(snippet)" @keydown.enter.prevent="viewSnippet(snippet)" @keydown.space.prevent="viewSnippet(snippet)" @keydown.arrow-down.prevent="focusResult($event, 1)" @keydown.arrow-up.prevent="focusResult($event, -1)">
                    <div class="snippet-card-header">
                        <h3 class="snippet-card-title" x-text="snippet.title"></h3>
                        <span class="snippet-card-language" :style="{ background: getLanguageColor(snippet.files?.[0]?.language || snippet.language) }"
                            x-text="snippet.files?.[0]?.language || snippet.language"></span>
                    </div>

                    <!-- Show description if exists, otherwise show first 2 lines of code -->
                    <p class="snippet-card-description" x-show="snippet.description && !filter.query" x-text="snippet.description">
                    </p>
                    <small class="match-filename" x-show="filter.query && snippet.preview_filename" x-text="snippet.preview_filename"></small>
                    <pre class="snippet-card-preview"
                        x-show="!snippet.description || filter.query"><code x-text="snippetExcerpt(snippet)"></code></pre>
                </div>

                <div class="snippet-card-footer">
                    <div class="snippet-card-tags">
                        <template x-for="tag in (snippet.tags || []).slice(0, 3)" :key="tag.id">
                            <span class="tag">
                                <span class="tag-dot" :style="{ background: tag.color }"></span>
                                <span x-text="tag.name"></span>
                            </span>
                        </template>
                    </div>
                    <div class="snippet-card-meta">
                        <span class="snippet-card-file-indicator"
                            :class="{ 'multi': snippet.files && snippet.files.length > 1 }"
                            :title="snippet.files && snippet.files.length > 1 ? snippet.files.length + ' files' : 'Single file'">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <span x-text="snippet.files && snippet.files.length > 1 ? snippet.files.length + ' files' : 'Single file'"></span>
                        </span>
                        <!-- Single file: simple copy button -->
                        <button x-show="!snippet.files || snippet.files.length <= 1" class="snippet-card-copy-btn"
                            @click.stop="copySnippetFromCard(snippet)" title="Copy code">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>

                        <!-- Multiple files: dropdown menu -->
                        <div x-show="snippet.files && snippet.files.length > 1" class="snippet-card-copy-dropdown"
                            x-data="{ open: false }" @click.outside="open = false">
                            <button class="snippet-card-copy-btn" @click.stop="open = !open"
                                :title="'Copy file (' + (snippet.files?.length || 0) + ' files)'">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" style="margin-left: 2px;">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                            <div x-show="open" x-cloak class="snippet-card-copy-menu" @click.stop>
                                <div class="snippet-card-copy-menu-header">Copy file:</div>
                                <template x-for="(file, index) in snippet.files" :key="file.id || index">
                                    <button class="snippet-card-copy-menu-item"
                                        @click="copyFileFromCard(snippet, file); open = false"
                                        :title="'Copy ' + file.filename">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2">
                                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                                            <polyline points="13 2 13 9 20 9"></polyline>
                                        </svg>
                                        <span x-text="file.filename"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <span x-show="snippet.is_favorite" title="Favorite">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor"
                                stroke-width="2">
                                <polygon
                                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                                </polygon>
                            </svg>
                        </span>
                        <span x-show="snippet.is_public" title="Public">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path
                                    d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                                </path>
                            </svg>
                        </span>
                        <!-- Expiration indicator -->
                        <span x-show="snippet.expires_at" 
                            :class="{ 'expired': isExpired(snippet.expires_at) }" 
                            :title="isExpired(snippet.expires_at) ? 'Expired' : 'Expires: ' + snippet.expires_at"
                            class="expiration-badge">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </span>
                        <span x-text="formatDate(snippet.updated_at)"></span>
                    </div>

                    <!-- Trash actions -->
                    <div class="snippet-card-actions" x-show="filter.isDeleted" @click.stop>
                        <button class="btn-icon" @click="restoreSnippet(snippet)" title="Restore">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                                height="16">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                        </button>
                        <button class="btn-icon danger" @click="confirmDelete(snippet)" title="Delete Permanently">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                                height="16">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </article>
        </template>
    </div>

</section>
{{end}}
